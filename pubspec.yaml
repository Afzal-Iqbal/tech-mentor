name: tech_saathi_ai
description: "TechSaathi AI: AI-powered digital literacy and banking education mobile application for older adults and digital beginners."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Design & Fonts
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Voice & Speech
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0

  # Media & Hardware
  image_picker: ^1.1.2

  # AI & Machine Learning
  google_generative_ai: ^0.4.6

  # Firebase Ecosystem
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Utilities & Storage
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
